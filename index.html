<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quem é a pagar?</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3ece0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="A pagar?">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3ece0; --ink:#2a211a; --muted:#6b5b45; --rule:#d6c8b2; --dash:#cdbda6;
  --terra:#b4401f; --terra-dark:#8d2f13; --hover:#e9dfcd;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100svh;display:flex;flex-direction:column}
a{color:var(--terra)}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.label{font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
main{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 26px) 26px 20px;max-width:560px;width:100%;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px}
.hero{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:26px 0;display:flex;flex-direction:column;gap:14px;animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.hero h1{margin:0;font:400 clamp(48px,15vw,62px)/0.88 'Instrument Serif',Georgia,serif;letter-spacing:-.01em}
.quip{font:italic 400 18px/1.4 'Instrument Serif',Georgia,serif;color:var(--muted)}
.section{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px dashed var(--dash)}
.chip{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;font:500 11px/1 'IBM Plex Mono',monospace;color:var(--paper)}
.name{flex:1;font:400 16px/1.2 Archivo,sans-serif}
.btn{border:none;border-radius:2px;padding:17px;background:var(--terra);color:#fdf8f0;font:500 15px/1 Archivo,sans-serif;width:100%}
.btn:hover{background:var(--terra-dark)}
.btn-ghost{background:none;border:1px solid var(--ink);color:var(--ink)}
.btn-ghost:hover{background:var(--hover)}
.actions{margin-top:26px;display:flex;flex-direction:column;gap:10px}
nav{flex:none;display:flex;border-top:1px solid var(--rule);background:var(--paper);padding:0 26px calc(env(safe-area-inset-bottom) + 14px);max-width:560px;width:100%;margin:0 auto}
nav button{flex:1;background:none;border:none;border-top:2px solid transparent;margin-top:-1px;padding:16px 0 12px;font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
nav button[data-on="1"]{color:var(--ink);border-top-color:var(--terra)}
.scrim{position:fixed;inset:0;background:rgba(42,33,26,.38);z-index:70;animation:fade .2s both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--paper);border-top:2px solid var(--ink);padding:26px 26px calc(env(safe-area-inset-bottom) + 30px);display:flex;flex-direction:column;gap:20px;animation:sheet .32s cubic-bezier(.2,.8,.2,1) both;max-width:560px;margin:0 auto}
.sheet h2{margin:0;font:400 30px/1.05 'Instrument Serif',Georgia,serif}
.field{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ink);padding-bottom:8px}
.field input{flex:1;border:none;outline:none;background:none;font:500 28px/1 'IBM Plex Mono',monospace;color:var(--ink);min-width:0}
.field input.txt{font:400 18px/1.2 Archivo,sans-serif}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--ink);border-radius:2px;padding:10px 14px;font:400 13px/1 Archivo,sans-serif;background:none;color:var(--ink)}
.pill[data-on="1"]{background:var(--ink);color:var(--paper)}
.toast{position:fixed;left:26px;right:26px;top:calc(env(safe-area-inset-top) + 16px);z-index:95;padding:15px 18px;background:var(--ink);color:var(--paper);font:400 14px/1.4 Archivo,sans-serif;animation:up .3s both;max-width:508px;margin:0 auto;box-shadow:0 8px 24px -12px rgba(42,33,26,.6)}
.bars{display:flex;gap:5px}
.bars div{height:10px;flex:1;background:#ddd0ba}
.stat{display:flex;flex-direction:column;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--rule)}
.note{padding:20px;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;gap:8px}
.note .quip{color:var(--paper)}
.install{border:1px dashed var(--dash);padding:16px;display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.install p{margin:0;font:400 13px/1.55 Archivo,sans-serif;color:var(--muted)}
.install strong{color:var(--ink);font-weight:500}
.install button{align-self:flex-start;background:none;border:none;padding:0;color:var(--terra);font:400 12px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
.state{padding:40px 0;text-align:center;color:var(--muted);font:400 14px/1.5 Archivo,sans-serif}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<main id="view"><div class="state">A carregar…</div></main>
<nav>
  <button data-tab="hoje" data-on="1">Hoje</button>
  <button data-tab="hist">Histórico</button>
  <button data-tab="nos">Nós</button>
</nav>
<div id="layer"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://adhrmghxntqbiaefqiwk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_V_1nt5hm_Oae9i0KTtn7Iw_Jlu69EcQ';
const DONO = 'vitorleorne@gmail.com';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESES_C = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
// quem está fora, e a partir de que sábado volta (inclusive)
const AUSENCIAS = { vitor: '2026-10-24' };

const AMIGOS = [
  { id: 'vitor', nome: 'Vítor', letra: 'V', cor: '#5f6b32' },
  { id: 'rui',   nome: 'Rui',   letra: 'R', cor: '#3f5670' },
  { id: 'nuno',  nome: 'Nuno',  letra: 'N', cor: '#b4401f' },
];

const st = {
  tab: 'hoje', sessao: null, dono: false, registos: null, erro: null,
  folha: null, toast: '', trocaId: null,
};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const amigo = id => AMIGOS.find(a => a.id === id) || { nome: id, letra: (id||'?')[0].toUpperCase(), cor: '#6b5b45' };
const dia = d => d.getDate() + ' ' + MESES_C[d.getMonth()];
const dData = s => { const p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');

function proximoSabado() {
  const d = new Date(); d.setHours(0,0,0,0);
  const delta = (6 - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + delta);
  return d;
}

function ultimoPor(id) {
  const r = (st.registos || []).filter(x => x.quem === id);
  return r.length ? r[0].data : null;
}

function disponivel(id, sabado) {
  const volta = AUSENCIAS[id];
  return !volta || sabado >= dData(volta);
}

function fila() {
  const sab = proximoSabado();
  const peso = a => { const d = ultimoPor(a.id); return d ? dData(d).getTime() : 0; };
  let base = AMIGOS.filter(a => disponivel(a.id, sab));
  if (!base.length) base = AMIGOS.slice();
  const ord = base.sort((x, y) => peso(x) - peso(y));
  if (st.trocaId) {
    const i = ord.findIndex(a => a.id === st.trocaId);
    if (i > 0) ord.unshift(ord.splice(i, 1)[0]);
  }
  return ord;
}

function quando(id) {
  const d = ultimoPor(id);
  return d ? 'pagou ' + dia(dData(d)) : 'nunca pagou';
}

function frase(a) {
  if (st.trocaId === a.id) return 'Troca combinada: entra ele, a fila fica intacta.';
  const d = ultimoPor(a.id);
  if (!d) return 'Ainda não pagou nenhuma vez. A estreia é hoje.';
  const n = Math.round((proximoSabado() - dData(d)) / (7 * 86400000));
  if (n <= 1) return 'Pagou no sábado passado, mas a fila deu a volta.';
  if (n === 2) return 'Há dois sábados que não põe a mão ao bolso.';
  return 'Há ' + n + ' sábados que não põe a mão ao bolso.';
}

async function carregar() {
  const { data, error } = await sb.from('pagamentos').select('*').order('data', { ascending: false });
  if (error) {
    st.erro = error.message;
    const cache = localStorage.getItem('qap.cache');
    if (cache) { st.registos = JSON.parse(cache); st.erro = null; }
  } else {
    st.registos = data;
    st.erro = null;
    localStorage.setItem('qap.cache', JSON.stringify(data));
  }
  pintar();
}

async function registar() {
  const sab = proximoSabado();
  const quem = fila()[0].id;
  const { error } = await sb.from('pagamentos').insert({ data: iso(sab), quem });
  if (error) { aviso('Não deu para gravar: ' + error.message); return; }
  st.folha = null; st.trocaId = null;
  aviso(amigo(quem).nome + ' pagou. A vez segue.');
  await carregar();
}

function aviso(t) {
  st.toast = t; pintar();
  clearTimeout(aviso._t);
  aviso._t = setTimeout(() => { st.toast = ''; pintar(); }, 3600);
}

/* ---------- vistas ---------- */

function vistaHoje() {
  const ord = fila(), proximo = ord[0], sab = proximoSabado();
  const dd = String(sab.getDate()).padStart(2, '0');
  const mm = String(sab.getMonth() + 1).padStart(2, '0');
  const aa = String(sab.getFullYear()).slice(2);

  // carimbos: última vez de cada um, do mais recente para o mais antigo
  const carimbos = AMIGOS.map(a => ({ a: a, d: ultimoPor(a.id) }))
    .filter(x => x.d)
    .sort((x, y) => dData(y.d) - dData(x.d))
    .map((x, i, arr) => `
      <div style="flex:1;padding:14px 8px;text-align:center;${i < arr.length - 1 ? 'border-right:1px dashed var(--dash);' : ''}">
        <div style="width:34px;height:34px;margin:0 auto 8px;border-radius:50%;background:${x.a.cor};color:#f3ece0;display:flex;align-items:center;justify-content:center;font:500 14px/1 'IBM Plex Mono',monospace">${x.a.letra}</div>
        <div class="mono" style="font-size:10.5px;color:var(--muted);text-transform:uppercase">${dia(dData(x.d))}</div>
      </div>`).join('');

  const segue = ord[1];
  const proxSab = new Date(sab); proxSab.setDate(proxSab.getDate() + 7);
  const linhas = [];
  if (segue) linhas.push('A seguir o ' + segue.nome + ', a ' + proxSab.getDate() + ' de ' + MESES[proxSab.getMonth()] + '.');
  AMIGOS.filter(a => !disponivel(a.id, sab)).forEach(a => {
    const v = dData(AUSENCIAS[a.id]);
    linhas.push(a.nome + ' volta a ' + v.getDate() + ' de ' + MESES[v.getMonth()] + '.');
  });

  return `
    ${bannerInstalacao()}
    <div style="border:1.5px solid var(--ink);display:flex;flex-direction:column">
      <div style="display:flex;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1.5px dashed var(--ink);font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase">
        <span>Quem é a pagar?</span><span data-act="login" style="cursor:pointer">${dd}.${mm}.${aa}</span>
      </div>
      <div style="padding:30px 12px 26px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;background:${proximo.cor};color:#fff">
        <div class="mono" style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#fff">Paga</div>
        <div class="serif" style="font-size:clamp(56px,20vw,78px);line-height:0.85">${esc(proximo.nome)}</div>
        <div class="mono" style="font-size:min(calc((100vw - 90px) / ${(frase(proximo).length * 0.6 + 1).toFixed(1)}), 15px);line-height:1.4;white-space:nowrap;color:#fff">${esc(frase(proximo))}</div>
      </div>
      ${carimbos ? `<div style="border-top:1.5px dashed var(--ink);display:flex">${carimbos}</div>` : ''}
    </div>
    ${linhas.length ? `<p style="margin:18px 0 0;font:400 14px/1.5 Archivo,sans-serif;color:var(--muted)">${esc(linhas.join(' '))}</p>` : ''}
    ${st.dono ? `<div class="actions">
      ${new Date().getDay() === 6
        ? '<button class="btn" data-act="abrir-pago">Já está pago</button>'
        : '<p style="margin:0;padding:15px 0;text-align:center;font:italic 400 16px/1.4 \'Instrument Serif\',Georgia,serif;color:var(--muted)">O registo abre no sábado.</p>'}
      <button class="btn btn-ghost" data-act="abrir-troca">Trocar a vez</button>
    </div>` : ''}
  `;
}

function vistaHist() {
  const regs = st.registos || [];
  if (!regs.length) return `<h1 class="serif" style="font-size:44px;margin:0 0 20px">Histórico</h1><div class="state">Ainda não há sábados registados.</div>`;
  const grupos = [];
  regs.forEach(r => {
    const d = dData(r.data), k = d.getFullYear() + '-' + d.getMonth();
    let g = grupos.find(x => x.k === k);
    if (!g) { g = { k, rotulo: MESES[d.getMonth()] + ' ' + d.getFullYear(), itens: [] }; grupos.push(g); }
    g.itens.push(r);
  });
  return `<h1 class="serif" style="font-size:44px;margin:0 0 20px">Histórico</h1>` + grupos.map(g => `
    <div class="section">
      <div class="label" style="border-bottom:1px solid var(--rule);padding-bottom:8px">${g.rotulo}</div>
      <div>${g.itens.map(r => {
        const a = amigo(r.quem), d = dData(r.data);
        return `<div class="row">
          <div class="chip" style="background:${a.cor}">${a.letra}</div>
          <div class="name">${esc(a.nome)}</div>
          <span class="mono" style="font-size:12px;color:var(--muted)">${dia(d)}</span>
        </div>`;
      }).join('')}</div>
    </div>`).join('');
}

function vistaNos() {
  const regs = st.registos || [];
  const conta = {};
  AMIGOS.forEach(a => { conta[a.id] = 0; });
  regs.forEach(r => { if (conta[r.quem] === undefined) return; conta[r.quem]++; });
  const maxC = Math.max(1, ...AMIGOS.map(a => conta[a.id]));
  const top = AMIGOS.slice().sort((x, y) => conta[y.id] - conta[x.id])[0];

  return `<h1 class="serif" style="font-size:44px;margin:0 0 20px">Nós três</h1>` +
    AMIGOS.map(a => `<div class="stat" style="margin-bottom:20px">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="chip" style="background:${a.cor}">${a.letra}</div>
          <div class="serif" style="flex:1;font-size:22px">${esc(a.nome)}</div>
          <div class="mono" style="font-size:12px;color:var(--muted)">${esc(quando(a.id))}</div>
        </div>
        <div class="bars">${Array.from({ length: maxC }, (_, i) => `<div style="${i < conta[a.id] ? 'background:' + a.cor : ''}"></div>`).join('')}</div>
        <div style="display:flex;align-items:baseline;gap:6px"><span class="mono" style="font-size:20px">${conta[a.id]}</span><span class="label">vezes que pagou</span></div>
      </div>`).join('') +
    (regs.length ? `<div class="note">
      <span class="label" style="color:#d8b49a">Curiosidade</span>
      <div class="quip">${esc(top.nome)} é quem já pagou mais vezes: ${conta[top.id]} sábados.</div>
    </div>` : '');
}

function avisoAusencias() {
  const sab = proximoSabado();
  const fora = AMIGOS.filter(a => !disponivel(a.id, sab));
  if (!fora.length) return '';
  return fora.map(a => {
    const v = dData(AUSENCIAS[a.id]);
    return `<p style="margin:2px 0 0;font:italic 400 15px/1.4 'Instrument Serif',Georgia,serif;color:var(--muted)">${esc(a.nome)} está fora da fila até ${v.getDate()} de ${MESES[v.getMonth()]}.</p>`;
  }).join('');
}

function bannerInstalacao() {
  if (localStorage.getItem('qap.instalado') === '1') return '';
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) return '';
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const android = /android/i.test(navigator.userAgent);
  if (!ios && !android) return '';
  const txt = ios
    ? 'Toca em <strong>Partilhar</strong> e depois em <strong>Adicionar ao ecrã principal</strong>. Tem de ser no Safari.'
    : 'Menu <strong>⋮</strong> do Chrome → <strong>Instalar aplicação</strong>.';
  return `<div class="install">
    <span class="label">Pôr no telemóvel</span>
    <p>${txt}</p>
    <button data-act="fechar-instalar">Já está / não mostrar</button>
  </div>`;
}

function folhaPagamento() {
  const proximo = fila()[0], sab = proximoSabado();
  return `<div class="scrim" data-act="fechar"></div>
  <div class="sheet">
    <div>
      <h2>Confirmas que pagou o ${esc(proximo.nome)}?</h2>
      <div class="mono" style="font-size:12px;color:var(--muted);margin-top:5px">sábado, ${sab.getDate()} de ${MESES[sab.getMonth()]}</div>
    </div>
    <p style="margin:0;font:400 13px/1.5 Archivo,sans-serif;color:var(--muted)">Fica registado neste sábado e a vez passa ao seguinte. Dá para desfazer só pela base de dados.</p>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" data-act="fechar">Ainda não</button>
      <button class="btn" style="flex:1" data-act="gravar">Sim, pagou</button>
    </div>
  </div>`;
}

function folhaTroca() {
  const ord = fila(), atual = ord[0];
  return `<div class="scrim" data-act="fechar"></div>
  <div class="sheet">
    <div>
      <h2>Quem paga em vez dele?</h2>
      <p style="margin:6px 0 0;font:400 13px/1.5 Archivo,sans-serif;color:var(--muted)">A troca vale só para este sábado. Ninguém perde o lugar na fila.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${ord.slice(1).map(a => `
        <button class="pill" style="display:flex;align-items:center;gap:12px;padding:15px 16px;text-align:left" data-troca="${a.id}">
          <span class="chip" style="background:${a.cor}">${a.letra}</span>
          <span style="flex:1;font:400 17px/1 Archivo,sans-serif">${esc(a.nome)}</span>
          <span class="mono" style="font-size:11px;color:var(--muted)">${esc(quando(a.id))}</span>
        </button>`).join('')}
    </div>
    <p style="margin:0;font:400 12px/1.5 Archivo,sans-serif;color:var(--muted)">Atual: ${esc(atual.nome)}</p>
  </div>`;
}

function folhaLogin() {
  return `<div class="scrim" data-act="fechar"></div>
  <div class="sheet">
    <div>
      <h2>Entrar</h2>
      <p style="margin:6px 0 0;font:400 13px/1.5 Archivo,sans-serif;color:var(--muted)">Só o dono regista pagamentos. A sessão fica guardada neste telemóvel.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="label">Email</span>
      <div class="field"><input class="txt" id="email" type="email" inputmode="email" autocomplete="username" placeholder="o teu email" value="${DONO}"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="label">Password</span>
      <div class="field"><input class="txt" id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    </div>
    <button class="btn" data-act="entrar">Entrar</button>
  </div>`;
}

function pintar() {
  const view = $('#view');
  if (st.registos === null && !st.erro) view.innerHTML = '<div class="state">A carregar…</div>';
  else if (st.erro) view.innerHTML = `<div class="state">Sem ligação aos dados.<br>${esc(st.erro)}</div>`;
  else view.innerHTML = st.tab === 'hoje' ? vistaHoje() : st.tab === 'hist' ? vistaHist() : vistaNos();

  document.querySelectorAll('nav button').forEach(b => b.dataset.on = b.dataset.tab === st.tab ? '1' : '0');

  const layer = $('#layer');
  layer.innerHTML =
    (st.folha === 'pago' ? folhaPagamento() : st.folha === 'troca' ? folhaTroca() : st.folha === 'login' ? folhaLogin() : '') +
    (st.toast ? `<div class="toast">${esc(st.toast)}</div>` : '');
}

/* ---------- eventos ---------- */

document.addEventListener('click', async e => {
  const tab = e.target.closest('nav button');
  if (tab) { st.tab = tab.dataset.tab; pintar(); return; }

  const troca = e.target.closest('[data-troca]');
  if (troca) {
    const anterior = fila()[0].nome;
    st.trocaId = troca.dataset.troca; st.folha = null;
    aviso(amigo(st.trocaId).nome + ' paga este sábado. ' + anterior + ' mantém a vez.');
    return;
  }

  const act = e.target.closest('[data-act]');
  if (!act) return;
  const a = act.dataset.act;
  if (a === 'fechar') { st.folha = null; pintar(); }
  if (a === 'abrir-pago') { st.folha = 'pago'; pintar(); }
  if (a === 'abrir-troca') { st.folha = 'troca'; pintar(); }
  if (a === 'login') { st.folha = 'login'; pintar(); }
  if (a === 'sair') { await sb.auth.signOut(); aviso('Sessão terminada.'); }
  if (a === 'fechar-instalar') { localStorage.setItem('qap.instalado', '1'); pintar(); }
  if (a === 'gravar') { await registar(); }
  if (a === 'entrar') {
    const email = ($('#email') || {}).value || DONO;
    const password = ($('#password') || {}).value || '';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { aviso('Não entrou: ' + error.message); return; }
    st.folha = null;
    aviso('Bem-vindo. Já podes registar pagamentos.');
  }
});

sb.auth.onAuthStateChange((_, sessao) => {
  st.sessao = sessao;
  st.dono = !!(sessao && sessao.user);
  pintar();
});

if (location.hash === '#dono') st.folha = 'login';

(async () => {
  const { data } = await sb.auth.getSession();
  st.sessao = data.session;
  st.dono = !!data.session;
  const cache = localStorage.getItem('qap.cache');
  if (cache) { try { st.registos = JSON.parse(cache); pintar(); } catch (err) {} }
  await carregar();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
